<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Login - YJ Attendance Bot</title>
	<link rel="stylesheet" href="../static/style.css"s>
</head>
<body>
	<h1>YJ PROJECT</h1>
	<div class="form-container">
		<h2>Login</h2>
		<form action="/login" method="post">
			<label for="tp">TP Number:</label><br>
			<input type="text" id="tp" name="tp" class="input-box" required><br>

			<label for="pwd">Password:</label><br>
			<input type="password" id="pwd" name="pwd" class="input-box" required><br>

			<label><input type="checkbox" name="remember"> Remember me</label><br>

			<button type="submit" class="submit-btn">Login</button>
		</form>

		{% if error %}
			<p style="color:red;">{{ error }}</p>
		{% endif %}
	</div>
</body>
</html>
